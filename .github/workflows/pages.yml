name: Deploy PearPortOS to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'main.js'
      - 'core/**'
      - 'shell/**'
      - 'apps/**'
      - 'assets/**'
      - 'ui/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify website content
        shell: bash
        run: |
          test -f index.html
          test -f main.js
          test -d shell
          test -d core
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
